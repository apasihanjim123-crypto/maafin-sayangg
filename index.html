<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maafin Aku? 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="heart">💗</div>
    <p class="small">BUAT KAMU YANG AKU SAYANG</p>
    <h1>Maafin aku, ya?</h1>

    <p class="message">
      Sayang, aku minta maaf ya atas semua kesalahanku.
      Aku sadar aku mungkin udah bikin kamu kecewa.
      Aku nggak mau cuma janji, aku mau belajar jadi lebih baik
      dan buktiin kalau aku beneran sayang sama kamu. 🥺
    </p>

    <div class="buttons" id="buttonArea">
      <button id="yesBtn">Maafin 💖</button>
      <button id="noBtn">Enggak 😤</button>
    </div>

    <p id="hint">Pilih jawaban kamu yaa 💌</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
